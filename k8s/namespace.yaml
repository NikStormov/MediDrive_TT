apiVersion: v1
kind: Namespace
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: order-service
  annotations:
    # Binds this KSA to the GCP service account created by
    # terraform/modules/gke (workload_identity_app_sa_email) via Workload
    # Identity. Replace placeholders at deploy time (CI substitutes these
    # from terraform output / environment) — see ANSWERS.md Q2 for the full
    # chain of trust.
    iam.gke.io/gcp-service-account: "order-service-wi-${ENVIRONMENT}@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
