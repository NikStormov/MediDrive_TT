# Credentials are never hardcoded or stored as plain Kubernetes Secret
# manifests in git. The Secrets Store CSI Driver (GCP provider) uses the
# order-service KSA's Workload Identity binding to read the DB credentials
# JSON payload directly from Secret Manager, and syncs selected fields into
# a native Kubernetes Secret (`order-service-db-credentials`) that the
# Deployment consumes via secretKeyRef. No key files, no plaintext secrets
# committed to this repository.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: order-service-db-credentials
  namespace: order-service
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/order-service-db-credentials-${ENVIRONMENT}/versions/latest"
        path: "db-credentials.json"
  secretObjects:
    - secretName: order-service-db-credentials
      type: Opaque
      data:
        - objectName: "db-credentials.json"
          key: DB_PASSWORD
          # The secret payload is a single JSON blob (see
          # terraform/modules/cloudsql main.tf secret_data); jmesPath
          # extracts individual fields into separate Secret keys.
        - objectName: "db-username"
          key: DB_USERNAME
        - objectName: "db-host"
          key: DB_HOST
        - objectName: "db-name"
          key: DB_NAME
